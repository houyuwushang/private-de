run:
  dataset_name: acs_sage_strong
  input_csv: external_workspace/external_inputs/acs_sage_strong/raw.csv
  output_dir: outputs/acs_sage_strong_qdte
  seed: 0
  device: gpu

preprocess:
  numerical_bins: 32
  missing_token: __MISSING__
  label_column: null
  auto_numeric_min_unique: 10

workload:
  include_oneway: true
  include_2way_cat: true
  include_prefix: true
  include_range: true
  include_mixed: true
  include_kway: true
  include_kway_prefix: false
  include_kway_range: false
  include_kway_mixed: false
  include_orthogonal_kway_mixed: false
  include_halfspace: false
  max_queries: 40000
  max_terms: 4
  range_intervals_per_num_attr: 64
  mixed_queries_per_pair: 64
  max_2way_cells: 20000
  kway_orders: [3, 4]
  kway_queries_per_order: 2048
  exact_group_sensitivity_max_cells: 200000
  random_seed: 0

privacy:
  mode: dp
  rho_total: 1.0
  delta: 1.0e-9
  measurement_mode: static_all
  measurement_allocation:
    oneway: 0.20
    twoway: 0.35
    kway: 0.45

projection:
  project_partitions: true
  clip_nonpartition: true
  prefix_monotonicity: false
  consistency:
    enabled: false
    method: local_marginal_ipf
    max_scope_cells: 200000
    max_iterations: 100
    tolerance: 1.0e-2
    max_lsq_iterations: 100

init:
  N_syn: same_as_real
  method: independent_oneway

qdte:
  objective_weighting: variance
  score_backend: dense_gpu
  transport_mode: atom_flow
  atom_flow_update_mode: batch
  atom_flow_pool_multiplier: 16
  atom_flow_max_pool: 0
  transport_prefix_strategy: best_advantage
  max_iters: 5000
  num_active_targets: 64
  candidates_per_target: 64
  total_candidates_per_iter: 4096
  accepted_per_iter: 64
  kappa_noise: 1.0
  allow_below_noise_fallback: false
  debt_alpha: 0.0
  debt_decay: 0.95
  debt_repay: 1.0
  debt_cap: 1.0e6
  lambda_cost: 0.01
  numerical_distance_gamma: 0.1
  random_candidate_fraction: 0.05
  source_over_sample_factor: 32
  full_recompute_every: 50
  stop_patience: 50
  min_advantage: 1.0e-6
  log_every: 100
  eval_every: 100

runtime:
  use_pmap: true
  scoring_chunk_size: 4096
  answer_batch_size: 8192
  xla_preallocate: true
  log_measurement_groups: false

evaluation:
  compute_true_query_error: true
  downstream_ml: false
  save_synthetic_csv: true
